name: Release Artifacts

"on":
  workflow_call:

concurrency:
  group: release-artifacts-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check version and publication status
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          BASE_VERSION="v$(node -p 'require("./package.json").version')"
          if [[ ! "$BASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid stable package version: $BASE_VERSION"
            exit 1
          fi
          LOCK_VERSION="v$(node -p 'require("./package-lock.json").version')"
          if [[ "$LOCK_VERSION" != "$BASE_VERSION" ]]; then
            echo "::error::package.json and package-lock.json versions differ"
            exit 1
          fi

          MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ -z "$MAIN_SHA" ]]; then
            echo "::error::Cannot resolve main"
            exit 1
          fi
          if [[ "$MAIN_SHA" != "$GITHUB_SHA" ]]; then
            echo "::notice::Skipping stale main commit $GITHUB_SHA"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RELEASES="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | [.tag_name, .draft, .prerelease] | @tsv')"
          VERSION_PATTERN='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\.[1-9][0-9]*)?$'
          STABLE="$(printf '%s\n' "$RELEASES" | awk -F '\t' '$2 == "false" && $3 == "false" { print $1 }' | grep -E "$VERSION_PATTERN" || true)"
          LATEST="$(printf '%s\n' "$STABLE" | sort -V | tail -n 1)"
          if [[ -n "$LATEST" ]]; then
            LATEST_BASE="$(cut -d. -f1-3 <<< "$LATEST")"
            if [[ "$(printf '%s\n' "$BASE_VERSION" "$LATEST_BASE" | sort -V | tail -n 1)" != "$BASE_VERSION" ]]; then
              echo "::notice::Skipping older upstream base $BASE_VERSION"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # Reuse the source reservation on retries; never publish the same commit twice.
          CURRENT="$(git tag --points-at "$GITHUB_SHA" --list "src-$BASE_VERSION" "src-$BASE_VERSION.*" | sed 's/^src-//' | grep -E "$VERSION_PATTERN" | sort -V | tail -n 1 || true)"
          if [[ -n "$CURRENT" ]] && grep -Fxq "$CURRENT" <<< "$STABLE"; then
            echo "::notice::Release $CURRENT already published for this commit"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Reserve all existing release and artifact/source tags, including interrupted releases.
          RESERVED="$( { printf '%s\n' "$RELEASES" | cut -f1; git tag --list 'v*' 'src-v*' | sed 's/^src-//'; } | grep -E "$VERSION_PATTERN" | awk -v base="$BASE_VERSION" '$0 == base || index($0, base ".") == 1' | sort -V | tail -n 1 || true)"
          if [[ -n "$CURRENT" && "$CURRENT" == "$RESERVED" ]]; then
            VERSION="$CURRENT"
          elif [[ -z "$RESERVED" ]]; then
            VERSION="$BASE_VERSION"
          elif [[ "$RESERVED" == "$BASE_VERSION" ]]; then
            # An upstream source tag alone does not consume the first release.
            if ! git show-ref --verify --quiet "refs/tags/$BASE_VERSION" && ! printf '%s\n' "$RELEASES" | cut -f1 | grep -Fxq "$BASE_VERSION"; then
              VERSION="$BASE_VERSION"
            else
              VERSION="$BASE_VERSION.1"
            fi
          else
            REVISION="${RESERVED##*.}"
            VERSION="$BASE_VERSION.$((REVISION + 1))"
          fi

          EXISTING="$(printf '%s\n' "$RELEASES" | awk -F '\t' -v tag="$VERSION" '$1 == tag')"
          if [[ -n "$EXISTING" ]]; then
            echo "::error::Release $VERSION already exists"
            exit 1
          fi
          if [[ -n "$LATEST" && "$(printf '%s\n' "$VERSION" "$LATEST" | sort -V | tail -n 1)" != "$VERSION" ]]; then
            echo "::notice::Skipping stale release version $VERSION"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "PREVIOUS_VERSION=$LATEST" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.version.outputs.publish == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: "npm"

      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: npm ci || npm install --no-audit --no-fund

      - name: Validate source
        if: steps.version.outputs.publish == 'true'
        run: npm run typecheck && npm run format:check && npm run lint

      - name: Build release artifacts
        if: steps.version.outputs.publish == 'true'
        run: npm run artifacts

      - name: Assemble dist payload
        if: steps.version.outputs.publish == 'true'
        run: |
          set -euo pipefail

          mkdir -p publish/yamls

          cp convert.js publish/convert.js
          cp convert.min.js publish/convert.min.js
          cp -a yamls/. publish/yamls/

          # Package yamls.tar.gz for release assets
          tar -czvf yamls.tar.gz yamls/

          RELEASED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          export RELEASED_AT

          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const crypto = require("node:crypto");

          const version = process.env.VERSION;
          const commit = process.env.GITHUB_SHA;
          const releasedAt = process.env.RELEASED_AT;

          function walkFiles(dir) {
            const output = [];
            const stack = [dir];
            while (stack.length > 0) {
              const current = stack.pop();
              for (const entry of fs.readdirSync(current, { withFileTypes: true })) {
                if (entry.name === ".git") continue;
                const fullPath = path.join(current, entry.name);
                if (entry.isDirectory()) {
                  stack.push(fullPath);
                } else {
                  output.push(fullPath);
                }
              }
            }
            return output.sort();
          }

          function sha256(filePath) {
            const data = fs.readFileSync(filePath);
            return crypto.createHash("sha256").update(data).digest("hex");
          }

          function writeManifest(targetDir) {
            const files = walkFiles(targetDir)
              .filter((filePath) => path.basename(filePath) !== "manifest.json")
              .map((filePath) => ({
                path: path.relative(targetDir, filePath).replace(/\\/g, "/"),
                sha256: sha256(filePath),
              }));

            const manifest = {
              tag: version,
              commit,
              releasedAt,
              fileCount: files.length,
              files,
            };

            fs.writeFileSync(
              path.join(targetDir, "manifest.json"),
              `${JSON.stringify(manifest, null, 2)}\n`,
              "utf-8"
            );
          }

          writeManifest("publish");
          NODE

      - name: Record source version tag
        if: steps.version.outputs.publish == 'true'
        run: |
          set -euo pipefail
          SOURCE_TAG="src-$VERSION"
          EXISTING="$(git ls-remote origin "refs/tags/$SOURCE_TAG")"
          if [[ -z "$EXISTING" ]]; then
            git push origin "$GITHUB_SHA:refs/tags/$SOURCE_TAG"
          else
            if [[ "$VERSION" == v*.*.*.* ]]; then
              TAG_SHA="$(git rev-parse "$SOURCE_TAG^{commit}")"
              if [[ "$TAG_SHA" != "$GITHUB_SHA" ]]; then
                echo "::error::Source tag $SOURCE_TAG belongs to another commit"
                exit 1
              fi
            fi
            echo "::notice::Source tag $SOURCE_TAG already exists; preserving it"
          fi

      - name: Publish to dist branch & Update Tag
        if: steps.version.outputs.publish == 'true'
        run: |
          set -euo pipefail
          cd publish
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b dist
          git add .
          git commit -m "Auto-generated dist for ${VERSION}"

          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          EXISTING="$(git ls-remote origin "refs/tags/$VERSION")"
          if [[ -n "$EXISTING" ]]; then
            # Resume an interrupted publication only when its artifact tag
            # belongs to this exact source commit. Never overwrite a version tag.
            git fetch --no-tags origin "refs/tags/$VERSION:refs/tags/$VERSION"
            git show "$VERSION:manifest.json" > existing-manifest.json
            EXISTING_SHA="$(node -p 'require("./existing-manifest.json").commit')"
            if [[ "$EXISTING_SHA" != "$GITHUB_SHA" ]]; then
              echo "::error::Artifact tag $VERSION refers to a different source commit"
              exit 1
            fi
            git push origin "+refs/tags/$VERSION:refs/heads/dist"
          else
            git push --atomic origin "+HEAD:refs/heads/dist" "HEAD:refs/tags/$VERSION"
          fi

      - name: Generate Release Notes
        if: steps.version.outputs.publish == 'true'
        run: |
          if [[ "$VERSION" == v*.*.*.* && -n "$PREVIOUS_VERSION" ]] && git rev-parse --verify "refs/tags/src-$PREVIOUS_VERSION" >/dev/null 2>&1; then
            git log --format='- %s (%h)' "src-$PREVIOUS_VERSION..$GITHUB_SHA" > RELEASE_NOTES.md
          else
            awk '/^#+ \[?[0-9]+\.[0-9]+\.[0-9]+/ { if (p) exit; p=1; next } p' CHANGELOG.md > RELEASE_NOTES.md
          fi
          
          cat >> RELEASE_NOTES.md << 'EOF'
          
          ---
          
          构建产物已同步并放于根目录。

          - JS 覆写 (最新版, 推荐)：`https://cdn.jsdelivr.net/gh/${{ github.repository }}@dist/convert.min.js`
          - JS 覆写 (当前版本)：`https://raw.githubusercontent.com/${{ github.repository }}/${{ env.VERSION }}/convert.min.js`
          - YAML 索引 (最新版)：`https://cdn.jsdelivr.net/gh/${{ github.repository }}@dist/manifest.json`
          - YAML 索引 (当前版本)：`https://raw.githubusercontent.com/${{ github.repository }}/${{ env.VERSION }}/manifest.json`
          EOF

      - name: Create GitHub release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          make_latest: true
          fail_on_unmatched_files: true
          body_path: RELEASE_NOTES.md
          files: |
            convert.js
            convert.min.js
            yamls.tar.gz

      - name: Purge jsDelivr cache
        if: steps.version.outputs.publish == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail

          curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}/convert.min.js"
          curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@dist/manifest.json"
